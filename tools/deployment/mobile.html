
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cassia Deployment Tool</title>
    <style type="text/css">
        .btn {
            cursor: pointer;
            margin-top: .5em;
            margin-bottom: .5em;
            min-width: 8.5rem;
            background: #0089FF;
            color: white;
            border: none;
            border-radius: .3em;
            font-size: 1.2em;
            padding: .45em 1em;
        }

        button[disabled]{
            background-color: #E2E2E2;
            cursor: not-allowed;
        }

        #scan_tab{
            width: 100%;
            min-width: 640px;
        }

        body {
            margin: 0;
            color: #333;
            font-family: 'PingFang SC', Arial, 'Hiragino Sans GB', sans-serif;
            background: #f5f7fa;
        }

        input,
        select,
        button {
            box-sizing: border-box;
            max-width: 100%;
        }

        .mobile-controls {
            width: min(720px, calc(100% - 24px));
            margin: 1.5em auto 1em;
            text-align: center;
            background: #fff;
            border: 1px solid #DFE6EE;
            border-radius: 8px;
            padding: 1em;
            box-sizing: border-box;
        }

        .mobile-row {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: .5em;
            margin-top: .5em;
        }

        .mobile-row input,
        .mobile-row select {
            min-height: 2.3em;
        }

        .mobile-table {
            width: min(100%, 100vw);
            overflow: auto;
            -webkit-overflow-scrolling: touch;
            background: #fff;
        }

        table.center {
          margin-left: auto;
          margin-right: auto;
        }

        th{
            background: #F9F9F9;
        }
        table th, table td{
            /*padding: 10px;*/
            font-size: 0.95em;
            text-align: center;
            border: 1px solid #DFE6EE;
        }
        table {
            width: 100%;
            border-spacing: 0px;
            border-collapse: collapse;
        }
/*        table thead tr th{
            border: none;
        }*/
        table tbody {
            width: calc(100% + 1px);
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        @media (max-width: 520px) {
            .mobile-controls {
                width: calc(100% - 16px);
                margin-top: .75em;
                padding: .75em;
            }

            .mobile-row {
                align-items: stretch;
            }

            .mobile-row input,
            .mobile-row select,
            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="mobile-controls">
        <div class="mobile-row">
        <select id="devtype">
            <option value="tBeacon">T100</option>
            <option value="cgm">CGM</option>
            <option value="cname" i18n="deployment.deviceName">Device Name</option>
            <option value="cmac" i18n="deployment.deviceMac">Device MAC</option>
        </select>
        <input id="rule" type="text" value="tBeacon" placeholder="mac or name support *" readonly>
        </div>
        <div class="mobile-row">
            <select id="select_route">
            </select>
            <input id="hubMac" type="text" value="" readonly>        
        </div>
        <div class="mobile-row"><label i18n='deployment.scanDuration'>Scan Time </label><input id="scanTimeout" type="text" value="60" style="width: 3.6em;text-align: center;"></div>
        <button class="btn" id="startScan" i18n="deployment.startScan">Start Scan</button>
    </div>

    <div class="mobile-table">
        <table id="scan_tab">
            <thead>
                <tr>
                    <th rowspan="2" i18n="deployment.deviceMac">Device MAC</th>
                    <th rowspan="2" i18n="deployment.deviceName">Device Name</th>
                    <th colspan="3" i18n="deployment.RSSI">RSSI</th>
                    <th rowspan="2" i18n="deployment.pkgNum">Package Number</th>
                </tr>
                <tr>
                    <th i18n="deployment.min">Min</th>
                    <th i18n="deployment.max">Max</th>
                    <th i18n="deployment.avg">Avg</th>
                </tr>
            </thead>
            <tbody>
            </tbody>
        </table>        
    </div> 
    <script src="./assets/js/zepto/1.2.0/zepto.min.js"></script>
    <script src="./assets/js/deployment/api.js?v=2103232023"></script>
    <script src="./assets/js/i18n.js?v=2103232023"></script>
    <script src="./assets/js/deployment/devicemacName.js"></script>
    <script src="./assets/js/deployment/mobile.js"></script>
    <script src="./assets/js/deployment/numberToWords.min.js"></script>
    <script type="text/javascript">
        i18n.render();
    </script>
</body>
</html>
